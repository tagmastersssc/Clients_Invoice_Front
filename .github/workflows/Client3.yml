
name: Client3 - Deploy web app to Azure Static Web Apps

on:
  push:
    branches: [ "prod","uat" ]

env:
  APP_LOCATION: "/" # location of your client code
  APP_ARTIFACT_LOCATION: "dist" # location of client code build output

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: write # for Azure/static-web-apps-deploy to comment on PRs
      id-token: write
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    environment:
      name: "${{github.ref_name}}"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Azure CLI script
        uses: azure/CLI@v1
        with:
          inlineScript: |
            echo VITE_LOGIN_APP_URL=$(az keyvault secret show --vault-name Client3-${{github.ref_name}}-eastus --name VITE-LOGIN-APP-URL --query value) >> $GITHUB_ENV

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: ${{ env.APP_LOCATION }}
          app_artifact_location: ${{ env.APP_ARTIFACT_LOCATION }}
        env:
          VITE_LOGIN_APP_URL: ${{ env.VITE_LOGIN_APP_URL }}
