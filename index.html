<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/bilailogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BilAI - Inicio de sesión</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__BILAI_RUNTIME_CONFIG__ = window.__BILAI_RUNTIME_CONFIG__ || {};
      (function () {
        var runtimeConfigUrl = "%VITE_RUNTIME_CONFIG_URL%";
        var apiBaseUrl = "%VITE_API_URL%";
        var hasExplicitRuntimeConfigUrl =
          runtimeConfigUrl && runtimeConfigUrl !== "%VITE_RUNTIME_CONFIG_URL%";
        var hasExplicitApiBaseUrl = apiBaseUrl && apiBaseUrl !== "%VITE_API_URL%";

        if (!hasExplicitRuntimeConfigUrl) {
          if (hasExplicitApiBaseUrl) {
            runtimeConfigUrl = apiBaseUrl.replace(/\/+$/, "") + "/runtime-config.js";
          } else {
            return;
          }
        }
        var script = document.createElement("script");
        script.src = runtimeConfigUrl;
        script.async = false;
        document.head.appendChild(script);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
